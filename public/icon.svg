<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Circular Luxury Obsidian Base -->
  <circle cx="16" cy="16" r="15" fill="#09090d"/>
  <!-- Gold Outer Rim -->
  <circle cx="16" cy="16" r="14.2" stroke="#c9a24b" stroke-width="1.2" fill="none" opacity="0.9"/>
  <!-- Gold Inner Halo -->
  <circle cx="16" cy="16" r="12.6" stroke="#c9a24b" stroke-width="0.5" fill="none" opacity="0.35"/>

  <!-- Stylized M Monogram -->
  <g stroke="#f0d599" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Stem -->
    <line x1="9.5" y1="8.5" x2="9.5" y2="16.5"/>
    <!-- Left Serif Top/Bottom -->
    <line x1="8.5" y1="8.5" x2="10.5" y2="8.5"/>
    <line x1="8.5" y1="16.5" x2="10.5" y2="16.5"/>
    <!-- Diagonals -->
    <path d="M9.5 8.5L16 14.5L22.5 8.5" stroke="#c9a24b"/>
    <!-- Right Stem -->
    <line x1="22.5" y1="8.5" x2="22.5" y2="16.5"/>
    <!-- Right Serif Top/Bottom -->
    <line x1="21.5" y1="8.5" x2="23.5" y2="8.5"/>
    <line x1="21.5" y1="16.5" x2="23.5" y2="16.5"/>
  </g>

  <!-- Aerodynamic Car Silhouette -->
  <g transform="translate(7.2, 17.5) scale(0.49)" stroke="#c9a24b" stroke-linecap="round" fill="none">
    <path d="M18 2C18 2 8 2 4 8C0 14 2 20 2 20H34C34 20 36 14 32 8C28 2 18 2 18 2Z" stroke-width="2.2" fill="#c9a24b" fill-opacity="0.12"/>
    <path d="M6 20C6 20 7 16 10 14H26C29 16 30 20 30 20" stroke-width="2.2"/>
    <circle cx="9" cy="20" r="3.2" stroke="#f0d599" stroke-width="2.2" fill="#09090d"/>
    <circle cx="27" cy="20" r="3.2" stroke="#f0d599" stroke-width="2.2" fill="#09090d"/>
  </g>
</svg>
